name: "Semantic Release ⚙️"

on:
  push:
    branches:
      - main

permissions:
  # `contents: write` — semantic-release pushes the version bump +
  # CHANGELOG commit + tag back to main.
  contents: write
  # `actions: write` — required for the "Trigger release-server
  # workflow" step (added below) to call
  # `gh workflow run release.yml`.  Without this, the dispatch
  # returns HTTP 403 "Resource not accessible by integration"
  # and the pipeline silently leaves the newly-bumped version
  # unpublished on crates.io.  Same permission set noetl/cli +
  # noetl/worker use.
  actions: write
  # `issues: write` + `pull-requests: write` — semantic-release's
  # GitHub plugin posts a successComment on the PR / closing
  # comment on the resolved issue.  Required when those comments
  # are enabled in .releaserc.json.
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24.2.3
          extra_plugins: |
            @semantic-release/changelog@6.0.3
            @semantic-release/git@10.0.1
            @semantic-release/exec@v7.1.0
            conventional-changelog-conventionalcommits@8.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub Actions safeguard: tags created by GITHUB_TOKEN do not
      # trigger workflows (prevents recursion).  The `release-server`
      # workflow is configured to run on `push: tags: ['v*']` but a
      # tag pushed by the semantic-release-action via GITHUB_TOKEN
      # won't fire it.  Explicitly dispatch it here so each new
      # version reaches the crate / image / GitHub Release flow.
      #
      # Same pattern as noetl/cli + noetl/worker.  Without this step,
      # noetl-server 2.0.0 was tagged but not published to crates.io
      # (release-server had to be dispatched manually).
      - name: Trigger release-server workflow
        # Repo variable RELEASE_BUILDS_ON_MERGE=false stops the automatic release
        # build (multi-arch images / binaries on GHA runners) after every merge;
        # the tag + notes are still created and the build is run on our machines
        # (ops scripts/local-build) or dispatched by hand. Unset = old behaviour.
        if: ${{ steps.semantic.outputs.new_release_published == 'true' && vars.RELEASE_BUILDS_ON_MERGE != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # ⚠ Take the version from semantic-release, NOT from Cargo.toml.
          # Since noetl/ai-meta#330 the bot no longer pushes the version bump to
          # `main` (a required status check rejects that push), so Cargo.toml is
          # a stale FLOOR here. Reading it would dispatch a release for the
          # PREVIOUS version — and it would look entirely successful.
          VERSION="${{ steps.semantic.outputs.new_release_version }}"
          if [[ -z "${VERSION}" ]]; then
            echo "no new_release_version from semantic-release; refusing to guess" >&2
            exit 1
          fi
          gh workflow run release.yml --ref main -f version="${VERSION}"

      - name: Release build left to the local build hosts
        if: ${{ steps.semantic.outputs.new_release_published == 'true' && vars.RELEASE_BUILDS_ON_MERGE == 'false' }}
        run: |
          echo "::notice::v${{ steps.semantic.outputs.new_release_version }} tagged; release build NOT dispatched (RELEASE_BUILDS_ON_MERGE=false)."
          echo "Build it on the AMD box / Mac Studio (noetl/ops scripts/local-build) or run: gh workflow run release.yml -f version=${{ steps.semantic.outputs.new_release_version }}"
